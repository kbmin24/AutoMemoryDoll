worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Backend enforces 100 MiB of resources; allow multipart/JSON overhead.
        client_max_body_size 102m;

        location ~ ^/api(?:/|$) {
            # Resolve replacements of the API container without restarting nginx.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            # Stream uploads so the 100 MiB allowance does not fill bounded /tmp.
            proxy_request_buffering off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
